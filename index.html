<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nasirda Election Survey</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f4f8;
  margin: 0;
  padding: 15px;
}
.container {
  max-width: 600px;
  margin: 20px auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 12px #ccc;
}
h1 {
  text-align: center;
  color: #123b70;
}
.subtitle {
  text-align: center;
  color: #555;
}
.candidate {
  margin: 24px 0;
}
.name {
  font-weight: bold;
  margin-bottom: 8px;
}
.bar-bg {
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
}
.bar {
  background: #1976d2;
  color: white;
  text-align: right;
  padding: 7px;
  border-radius: 20px;
  box-sizing: border-box;
  min-width: 45px;
}
.notice {
  background: #fff4d6;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  color: #664d03;
}
.footer {
  text-align: center;
  font-size: 13px;
  color: #666;
  margin-top: 25px;
}
</style>

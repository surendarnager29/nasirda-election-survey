<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>नासिरदा सर्वे रिजल्ट</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f9;
  color:#222;
}

.header{
  background:linear-gradient(135deg,#111827,#374151);
  color:white;
  text-align:center;
  padding:28px 15px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  opacity:.85;
}

.container{
  max-width:700px;
  margin:25px auto;
  padding:0 15px;
}

.notice{
  background:#fff8e1;
  border:1px solid #ffe08a;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-size:14px;
  margin-bottom:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.name{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.percent{
  font-size:25px;
  font-weight:bold;
  margin-bottom:10px;
}

.bar-bg{
  width:100%;
  height:16px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
}

.bar{
  height:100%;
  background:linear-gradient(90deg,#2563eb,#06b6d4);
  border-radius:20px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:20px;
}
</style>
</head>

<body>

<div class="header">
  <h1>नासिरदा सर्वे रिजल्ट</h1>
  <p>उम्मीदवारों के समर्थन का अनौपचारिक सर्वे</p>
</div>

<div class="container">

  <div class="notice">
    ⚠️ यह अनौपचारिक सर्वे है। यह आधिकारिक चुनाव परिणाम नहीं है।
  </div>


  <!--
  ==================================================
  RESULT UPDATE करने के लिए सिर्फ नीचे नाम और %
  बदलना है।
  ==================================================
  -->


  <div class="card">
    <div class="name">जगदीश धाकड़</div>
    <div class="percent">28%</div>

    <div class="bar-bg">
      <div class="bar" style="width:28%"></div>
    </div>
  </div>


  <div class="card">
    <div class="name">मनोज खांडल</div>
    <div class="percent">16%</div>

    <div class="bar-bg">
      <div class="bar" style="width:16%"></div>
    </div>
  </div>


  <div class="card">
    <div class="name">शिवराज धाकड़</div>
    <div class="percent">12%</div>

    <div class="bar-bg">
      <div class="bar" style="width:12%"></div>
    </div>
  </div>


  <div class="footer">
    Nasirda Survey • Unofficial Survey
  </div>

</div>

</body>
</html>
